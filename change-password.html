<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0, maximum-scale=0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; connect-src *;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    
<title>Change Password — Purok Kaligtasan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary-green: #0f7a4a;
        --secondary-green: #34b78f;
        --accent-orange: #ff7a00;
        --light-green: #e9f7f2;
        --dark-green: #0a5c38;
        --light-gray: #f8faf9;
        --medium-gray: #e1e8e5;
        --text-dark: #1e2e28;
        --text-light: #6b6f6b;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(6, 30, 20, 0.1);
        --shadow-light: 0 4px 12px rgba(6, 30, 20, 0.05);
        --radius: 16px;
        --radius-sm: 8px;
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, var(--light-green) 0%, #f0f9f5 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
    }

    .bg-pattern {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
    }
    .bg-circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(15, 122, 74, 0.05);
    }
    .circle-1 { width: 200px; height: 200px; top: -100px; right: -100px; }
    .circle-2 { width: 150px; height: 150px; bottom: -75px; left: -75px; background: rgba(255, 122, 0, 0.05); }
    .circle-3 { width: 100px; height: 100px; top: 50%; left: 10%; background: rgba(52, 183, 143, 0.05); }

    .container {
        width: 100%;
        max-width: 380px;
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        animation: fadeIn 0.6s ease-out;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .header {
        background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
        padding: 24px 20px;
        text-align: center;
        color: white;
        position: relative;
    }
    
    .logo-circle {
        width: 100px;
        height: 100px;
        margin: 0 auto 12px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(5px);
    }
    
    .logo-circle img {
        width: 90px;
        height: 90px;
    }
    
    .badge {
        position: absolute;
        top: 15px;
        right: 15px;
        background: var(--accent-orange);
        color: white;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    
    .header h1 {
        font-size: 1.4rem;
        margin-bottom: 4px;
        font-weight: 700;
    }
    
    .header p {
        font-size: 0.85rem;
        opacity: 0.9;
    }
    
    .content {
        padding: 28px 24px;
    }
    
    .warning-box {
        background: #fff8e1;
        border-left: 4px solid #ff9800;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .warning-box i {
        font-size: 1.5rem;
        color: #ff9800;
    }
    
    .warning-box p {
        color: #856404;
        font-size: 0.85rem;
        margin: 0;
        line-height: 1.4;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-dark);
        font-weight: 500;
        font-size: 0.9rem;
    }
    
    .input-with-icon {
        position: relative;
        display: block;
        width: 100%;
    }
    
    .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-light);
        font-size: 1rem;
        pointer-events: none;
        z-index: 1;
    }
    
    .form-input {
        width: 100%;
        padding: 14px 40px 14px 42px;
        border: 2px solid var(--medium-gray);
        border-radius: var(--radius-sm);
        font-size: 16px;
        color: var(--text-dark);
        background: var(--white);
        transition: all 0.3s ease;
        -webkit-appearance: none;
        appearance: none;
        line-height: 1.5;
        box-sizing: border-box;
        position: relative;
        z-index: 0;
    }
    
    @media screen and (max-width: 768px) {
        .form-input { font-size: 16px !important; transform: scale(1); transform-origin: left center; }
        .form-input:focus { font-size: 16px !important; }
    }
    
    .form-input:focus {
        outline: none;
        border-color: var(--primary-green);
        box-shadow: 0 0 0 3px rgba(15, 122, 74, 0.1);
        transform: scale(1);
    }
    
    .form-input::placeholder { color: #a0a8a4; }
    
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-light);
        cursor: pointer;
        font-size: 1rem;
        padding: 6px;
        -webkit-tap-highlight-color: transparent;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        box-sizing: border-box;
    }
    
    .password-toggle i { pointer-events: none; }
    
    .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        -webkit-tap-highlight-color: rgba(15, 122, 74, 0.3);
        touch-action: manipulation;
        position: relative;
        box-sizing: border-box;
        margin-top: 8px;
    }
    
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(15, 122, 74, 0.25);
    }
    
    .btn:active { transform: translateY(0); }
    
    .btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }
    
    .btn-loading .btn-text { visibility: hidden; }
    .btn-loading::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .password-strength {
        margin-top: 8px;
        font-size: 0.75rem;
    }
    
    .strength-weak { color: #dc2626; }
    .strength-medium { color: #ff9800; }
    .strength-strong { color: #0f7a4a; }
    
    .footer-link {
        margin-top: 20px;
        text-align: center;
    }
    
    .footer-link a {
        color: var(--text-light);
        font-size: 0.8rem;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    
    .footer-link a:hover {
        color: var(--primary-green);
    }
    
    @media (max-width: 480px) {
        .container {
            margin: 0 15px;
            max-width: 100%;
        }
        .content {
            padding: 24px 16px;
        }
        .form-input {
            padding: 14px 38px 14px 40px;
        }
        .circle-1, .circle-2, .circle-3 { display: none; }
    }
    
    @supports (-webkit-touch-callout: none) {
        body { min-height: -webkit-fill-available; }
        .form-input { font-size: 16px !important; line-height: 1.5; }
    }
    
    @media (max-height: 500px) and (orientation: landscape) {
        body { align-items: flex-start; padding: 10px; }
        .container { margin: 10px auto; max-width: 90%; }
        .header { padding: 15px 16px; }
        .content { padding: 20px 16px; }
    }
    
    @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
        .container { max-width: 400px; }
    }
    
    @media screen and (max-width: 767px) {
        input, select, textarea { font-size: 16px !important; }
    }
    
    @media screen and (-webkit-min-device-pixel-ratio:0) { 
        select, textarea, input { font-size: 16px !important; }
    }
</style>
</head>
<body>
<div class="bg-pattern">
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="bg-circle circle-3"></div>
</div>

<div class="container">
    <div class="header">
        <div class="badge">SECURE CHANGE</div>
        <div class="logo-circle">
            <img src="assets/MDRRMO Logo.png" alt="MDRRMO Logo">
        </div>
        <h1>Change Password Required</h1>
        <p>Please set a new password to continue</p>
    </div>
    
    <div class="content">
        <div class="warning-box">
            <i class="fas fa-exclamation-triangle"></i>
            <p>You are using a temporary password. For security reasons, you must change your password before continuing.</p>
        </div>
        
        <div class="form-group">
            <label class="form-label">Current / Temporary Password</label>
            <div class="input-with-icon">
                <i class="input-icon fas fa-lock"></i>
                <input type="password" id="currentPassword" class="form-input" placeholder="Enter current password" autocomplete="off">
                <button type="button" class="password-toggle" id="toggleCurrentPassword" aria-label="Show password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">New Password</label>
            <div class="input-with-icon">
                <i class="input-icon fas fa-key"></i>
                <input type="password" id="newPassword" class="form-input" placeholder="Enter new password" autocomplete="off">
                <button type="button" class="password-toggle" id="toggleNewPassword" aria-label="Show password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div id="passwordStrength" class="password-strength"></div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <div class="input-with-icon">
                <i class="input-icon fas fa-check-circle"></i>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password" autocomplete="off">
                <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        
        <button id="changePasswordBtn" class="btn">
            <i class="fas fa-save"></i> Change Password & Continue
        </button>
        
        <div class="footer-link">
            <a href="index.html">
                <i class="fas fa-sign-out-alt"></i> Logout and return to login
            </a>
        </div>
    </div>
</div>

<!-- MODAL: Info/Error Modal (replaces alert and inline messages) -->
<div id="infoModal" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 16px;">
    <div style="background: white; border-radius: 12px; max-width: 280px; width: 100%; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1), 0 3px 8px rgba(0, 0, 0, 0.05); animation: modalSlideUp 0.2s ease; overflow: hidden;">
        <div style="padding: 20px 20px 12px 20px; text-align: center;">
            <div style="margin-bottom: 8px;" id="infoIcon">
                <i class="fas fa-info-circle" style="font-size: 1.6rem; color: #0f7a4a; opacity: 0.7;"></i>
            </div>
            <h3 style="margin: 0 0 4px 0; color: #1e293b; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em;" id="infoTitle">Notice</h3>
            <p style="margin: 0; color: #64748b; font-size: 0.8rem; line-height: 1.4; font-weight: 400;" id="infoMessage"></p>
        </div>
        <div style="display: flex; gap: 8px; padding: 4px 20px 20px 20px;">
            <button id="infoOkBtn" style="flex: 1; padding: 6px 10px; border-radius: 6px; font-weight: 500; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.15s ease; outline: none; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); letter-spacing: 0.3px; border: 1.5px solid #0f7a4a; background: transparent; color: #0f7a4a;">
                <i class="fas fa-check"></i> OK
            </button>
        </div>
    </div>
</div>

<!-- MODAL: Success Modal -->
<div id="successModal" style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 16px;">
    <div style="background: white; border-radius: 12px; max-width: 280px; width: 100%; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1), 0 3px 8px rgba(0, 0, 0, 0.05); animation: modalSlideUp 0.2s ease; overflow: hidden;">
        <div style="padding: 20px 20px 12px 20px; text-align: center;">
            <div style="margin-bottom: 8px;">
                <i class="fas fa-check-circle" style="font-size: 1.6rem; color: #0f7a4a; opacity: 0.7;"></i>
            </div>
            <h3 style="margin: 0 0 4px 0; color: #1e293b; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em;">Success!</h3>
            <p style="margin: 0; color: #64748b; font-size: 0.8rem; line-height: 1.4; font-weight: 400;" id="successMessage">Password changed successfully! Redirecting...</p>
        </div>
    </div>
</div>

<style>
    @keyframes modalSlideUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ SUPABASE CONFIGURATION ============
const SUPABASE_URL = 'https://opibntxwagnjazpbtxrv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UwyTZU3BYj41z0D7beu9Hg_pIZcLeWN';

let supabaseClient;
if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// ============ MODAL MANAGER ============
const ModalManager = {
    showInfo: function(title, message, type = 'info') {
        const modal = document.getElementById('infoModal');
        const iconEl = document.getElementById('infoIcon');
        const titleEl = document.getElementById('infoTitle');
        const msgEl = document.getElementById('infoMessage');
        const iconConfig = {
            info: { icon: 'fa-info-circle', color: '#0f7a4a' },
            error: { icon: 'fa-exclamation-circle', color: '#dc2626' },
            warning: { icon: 'fa-exclamation-triangle', color: '#ff7a00' }
        };
        const config = iconConfig[type] || iconConfig.info;
        iconEl.innerHTML = `<i class="fas ${config.icon}" style="font-size: 1.6rem; color: ${config.color}; opacity: 0.7;"></i>`;
        titleEl.textContent = title;
        msgEl.textContent = message;
        modal.style.display = 'flex';
    },
    showSuccess: function(message) {
        const modal = document.getElementById('successModal');
        const msgEl = document.getElementById('successMessage');
        msgEl.textContent = message;
        modal.style.display = 'flex';
    },
    hideInfo: function() {
        document.getElementById('infoModal').style.display = 'none';
    },
    hideSuccess: function() {
        document.getElementById('successModal').style.display = 'none';
    }
};

// ============ HELPER FUNCTIONS ============
async function hashPassword(password) {
    const msgBuffer = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ============ PASSWORD STRENGTH ============
function checkPasswordStrength(password) {
    const strengthDiv = document.getElementById('passwordStrength');
    
    if (password.length === 0) {
        strengthDiv.innerHTML = '';
        return;
    }
    
    let strength = 0;
    let message = '';
    let className = '';
    
    if (password.length >= 8) strength++;
    if (password.match(/[a-z]+/)) strength++;
    if (password.match(/[A-Z]+/)) strength++;
    if (password.match(/[0-9]+/)) strength++;
    if (password.match(/[$@#&!]+/)) strength++;
    
    if (strength <= 2) {
        message = 'Weak password';
        className = 'strength-weak';
    } else if (strength <= 4) {
        message = 'Medium password';
        className = 'strength-medium';
    } else {
        message = 'Strong password';
        className = 'strength-strong';
    }
    
    strengthDiv.innerHTML = `<i class="fas fa-shield-alt"></i> ${message}`;
    strengthDiv.className = `password-strength ${className}`;
}

// ============ PASSWORD TOGGLE ============
function setupPasswordToggle(inputId, toggleId) {
    const toggleBtn = document.getElementById(toggleId);
    const input = document.getElementById(inputId);
    if (toggleBtn && input) {
        toggleBtn.addEventListener('click', function() {
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
    }
}

// ============ CHANGE PASSWORD ============
async function changePassword() {
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('changePasswordBtn');
    const originalHTML = btn.innerHTML;
    
    // Validation
    if (!currentPassword) {
        ModalManager.showInfo('Missing Information', 'Please enter your current password', 'error');
        return;
    }
    
    if (!newPassword) {
        ModalManager.showInfo('Missing Information', 'Please enter a new password', 'error');
        return;
    }
    
    if (newPassword.length < 8) {
        ModalManager.showInfo('Password Too Short', 'New password must be at least 8 characters long', 'error');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        ModalManager.showInfo('Password Mismatch', 'New passwords do not match', 'error');
        return;
    }
    
    if (currentPassword === newPassword) {
        ModalManager.showInfo('Invalid Password', 'New password must be different from the current password', 'error');
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Changing password...';
    btn.classList.add('btn-loading');
    
    try {
        // Try to get username from multiple sources
        let username = sessionStorage.getItem('tempUsername');
        
        if (!username) {
            username = localStorage.getItem('username');
            console.log('Using localStorage username:', username);
        }
        
        if (!username) {
            // Try to get from the mustChangePassword flag's user
            const storedUser = sessionStorage.getItem('mustChangePassword');
            if (storedUser === 'true') {
                // Try to get from any stored user data
                username = localStorage.getItem('staffName') || localStorage.getItem('username');
            }
        }
        
        if (!username) {
            console.error('No username found in storage');
            ModalManager.showInfo('Session Error', 'User session not found. Please login again.', 'error');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
            return;
        }
        
        console.log('Changing password for user:', username);
        
        const currentPasswordHash = await hashPassword(currentPassword);
        const newPasswordHash = await hashPassword(newPassword);
        
        // First, get the user to verify current password
        const { data: userData, error: fetchError } = await supabaseClient
            .from('users')
            .select('id, username, full_name, role, assigned_barangay, password_hash')
            .eq('username', username)
            .maybeSingle();
        
        if (fetchError || !userData) {
            console.error('User not found:', fetchError);
            ModalManager.showInfo('User Not Found', `User "${username}" not found in the system. Please login again.`, 'error');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
            return;
        }
        
        // Verify current password
        if (userData.password_hash !== currentPasswordHash) {
            ModalManager.showInfo('Authentication Failed', 'Current password is incorrect', 'error');
            btn.disabled = false;
            btn.innerHTML = originalHTML;
            btn.classList.remove('btn-loading');
            return;
        }
        
        // Update password
        const { error: updateError } = await supabaseClient
            .from('users')
            .update({
                password_hash: newPasswordHash,
                must_change_password: false,
                updated_at: new Date().toISOString()
            })
            .eq('username', username);
        
        if (updateError) throw updateError;
        
        // Clear temporary session data
        sessionStorage.removeItem('mustChangePassword');
        sessionStorage.removeItem('tempUsername');
        
        // Clear any existing session data first
        localStorage.removeItem('staffName');
        localStorage.removeItem('username');
        localStorage.removeItem('userRole');
        localStorage.removeItem('assignedBarangay');
        localStorage.removeItem('isGuest');
        localStorage.removeItem('loggedIn');
        
        // Store permanent session
        localStorage.setItem('loggedIn', 'true');
        localStorage.setItem('username', username);
        localStorage.setItem('staffName', userData.full_name || username);
        localStorage.setItem('userRole', userData.role === 'admin' ? 'admin' : 'staff');
        localStorage.setItem('assignedBarangay', userData.assigned_barangay || '');
        localStorage.setItem('loginTime', Date.now().toString());
        localStorage.setItem('lastActivity', Date.now().toString());
        
        // Show success modal
        ModalManager.showSuccess('Password changed successfully! Redirecting...');
        
        setTimeout(() => {
            window.location.href = 'main.html';
        }, 2000);
        
    } catch (err) {
        console.error('Change password error:', err);
        ModalManager.showInfo('Error', err.message || 'Unable to change password. Please try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        btn.classList.remove('btn-loading');
    }
}

// ============ CHECK SESSION ============
function checkSession() {
    const mustChange = sessionStorage.getItem('mustChangePassword');
    const username = sessionStorage.getItem('tempUsername');
    
    console.log('Session check - mustChange:', mustChange, 'username:', username);
    
    if (!mustChange || mustChange !== 'true' || !username) {
        // Also check localStorage as fallback before redirecting
        const localUsername = localStorage.getItem('username');
        if (localUsername && mustChange === 'true') {
            console.log('Found username in localStorage, using it:', localUsername);
            sessionStorage.setItem('tempUsername', localUsername);
            return; // Allow the page to load
        }
        
        console.log('Session expired, redirecting to login');
        window.location.href = 'index.html';
    }
}

// ============ INITIALIZATION ============
document.addEventListener('DOMContentLoaded', function() {
    checkSession();
    
    // Setup all password toggles
    setupPasswordToggle('currentPassword', 'toggleCurrentPassword');
    setupPasswordToggle('newPassword', 'toggleNewPassword');
    setupPasswordToggle('confirmPassword', 'toggleConfirmPassword');
    
    const newPasswordInput = document.getElementById('newPassword');
    if (newPasswordInput) {
        newPasswordInput.addEventListener('input', function() {
            checkPasswordStrength(this.value);
        });
    }
    
    const changeBtn = document.getElementById('changePasswordBtn');
    if (changeBtn) {
        changeBtn.addEventListener('click', changePassword);
    }
    
    // Close modals when clicking OK
    document.getElementById('infoOkBtn').onclick = () => {
        ModalManager.hideInfo();
    };
    
    // Allow Enter key to submit
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                changePassword();
            }
        });
    });
});
</script>
